<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Niyam AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(at 0% 0%, #faf4ff 0px, transparent 50%), radial-gradient(at 100% 0%, #e2d7ff 0px, transparent 50%), radial-gradient(at 100% 100%, #fbcfe8 0px, transparent 50%), radial-gradient(at 0% 100%, #e0e7ff 0px, transparent 50%); background-attachment: fixed; min-height: 100vh; }
    </style>
</head>
<body class="text-[#32294f]">

    <!-- Header -->
    <nav class="fixed top-0 w-full z-50 backdrop-blur-xl bg-white/40 shadow-sm">
        <div class="flex justify-between items-center px-8 py-4 max-w-screen-2xl mx-auto">
            <a href="index.html" class="text-2xl font-black tracking-tighter text-[#4a40e0]">Niyam <span class="text-[#10b981]">AI</span></a>
            <a href="signup.html" class="px-5 py-2 text-sm font-bold bg-[#4a40e0] text-white rounded-xl shadow-lg hover:scale-[1.02] transition-transform">Sign Up</a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="min-h-screen flex items-center justify-center pt-20 px-4">
        <div class="w-full max-w-md bg-white/70 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/50 p-10">
            <h2 class="text-2xl font-extrabold text-[#32294f] mb-1">Welcome back</h2>
            <p class="text-[#5f557f] text-sm mb-8">Please enter your details to sign in.</p>

            <div id="error-message" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm mb-6"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-semibold text-[#32294f] mb-1.5">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required
                        class="w-full px-4 py-3 rounded-xl border border-[#e2d7ff] bg-white/80 text-[#32294f] placeholder-[#b2a6d5] focus:ring-2 focus:ring-[#4a40e0]/30 focus:border-[#4a40e0] outline-none transition-all">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="password" class="text-sm font-semibold text-[#32294f]">Password</label>
                        <a href="#" class="text-xs text-[#4a40e0] font-medium hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required
                        class="w-full px-4 py-3 rounded-xl border border-[#e2d7ff] bg-white/80 text-[#32294f] placeholder-[#b2a6d5] focus:ring-2 focus:ring-[#4a40e0]/30 focus:border-[#4a40e0] outline-none transition-all">
                </div>
                <button type="submit" id="login-btn"
                    class="w-full py-3.5 bg-[#4a40e0] text-white font-bold rounded-xl shadow-lg shadow-[#4a40e0]/25 hover:scale-[1.01] transition-transform">
                    Log In
                </button>
            </form>

            <p class="text-center text-sm text-[#5f557f] mt-8">Don't have an account?
                <a href="signup.html" class="text-[#4a40e0] font-semibold hover:underline">Sign up</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = CONFIG.API_URL;
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');
            errorDiv.style.display = 'none'; errorDiv.innerText = '';
            loginBtn.innerText = 'Logging in...'; loginBtn.disabled = true;
            try {
                const response = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
                const data = await response.json();
                if (!response.ok) {
                    if (response.status === 403 && data.detail && typeof data.detail === 'object' && data.detail.requires_verification) {
                        localStorage.setItem('niyam_verify_email', data.detail.email || email);
                        const devCode = data.detail._dev_verification_code || '';
                        const verifyUrl = `verify-email.html?email=${encodeURIComponent(data.detail.email || email)}` + (devCode ? `&code=${devCode}` : '');
                        window.location.href = verifyUrl;
                        return;
                    }
                    let errorMessage = 'Login failed';
                    if (data.detail) {
                        if (typeof data.detail === 'string') { errorMessage = data.detail; }
                        else if (Array.isArray(data.detail)) { errorMessage = data.detail.map(err => err.msg || JSON.stringify(err)).join('\n'); }
                        else if (data.detail.detail) { errorMessage = data.detail.detail; }
                        else { errorMessage = JSON.stringify(data.detail); }
                    }
                    throw new Error(errorMessage);
                }
                if (data.success) { localStorage.setItem('niyam_access_token', data.data.access_token); localStorage.setItem('niyam_refresh_token', data.data.refresh_token); localStorage.setItem('niyam_user_name', data.data.user_name); localStorage.setItem('niyam_business_name', data.data.business_name); window.location.href = 'dashboard.html'; }
            } catch (error) { console.error('Login error:', error); errorDiv.innerText = error.message; errorDiv.style.display = 'block'; errorDiv.classList.remove('hidden'); } finally { loginBtn.innerText = 'Log In'; loginBtn.disabled = false; }
        });
    </script>
</body>
</html>
