<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Niyam AI</title>
    <meta name="description" content="Reset your Niyam AI account password.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface-variant": "#5f557f",
                        "outline": "#7b719c",
                        "surface-container-high": "#e8deff",
                        "surface-container": "#ede4ff",
                        "on-surface": "#32294f",
                        "on-primary": "#f4f1ff",
                        "primary": "#4a40e0",
                        "primary-dim": "#3d30d4",
                        "tertiary": "#6a37d4",
                        "success": "#10b981",
                        "error": "#b41340",
                        "outline-variant": "#b2a6d5",
                        "background": "#faf4ff",
                        "surface": "#faf4ff",
                    },
                    fontFamily: { "body": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(at 0% 0%, #faf4ff 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #e2d7ff 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #fbcfe8 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #e0e7ff 0px, transparent 50%);
            background-attachment: fixed;
            color: #32294f;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Nav -->
    <header class="border-b border-outline-variant/20 bg-white/40 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="logo-icon.svg" alt="Niyam AI" class="h-8">
                <span class="text-xl font-black tracking-tighter text-primary">Niyam <span class="text-success">AI</span></span>
            </a>
            <a href="login.html" class="text-sm font-semibold text-primary hover:underline">Back to Login</a>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <div class="glass-card rounded-2xl p-8 shadow-xl shadow-primary/10">

                <!-- Step 1: Request code -->
                <div id="step-request">
                    <div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center mb-6">
                        <span class="material-symbols-outlined text-primary text-2xl">lock_reset</span>
                    </div>
                    <h1 class="text-2xl font-extrabold text-on-surface mb-1">Forgot your password?</h1>
                    <p class="text-sm text-on-surface-variant mb-6">Enter your email and we'll send a 6-digit reset code.</p>

                    <div id="req-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-4"></div>

                    <form id="form-request" class="space-y-4">
                        <div>
                            <label for="req-email" class="block text-sm font-medium text-on-surface mb-1.5">Email address</label>
                            <input type="email" id="req-email" required placeholder="you@company.com"
                                class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/60 bg-white/80 text-on-surface placeholder-on-surface-variant/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary text-sm">
                        </div>
                        <button type="submit" id="req-btn"
                            class="w-full py-2.5 px-4 bg-primary text-on-primary font-bold rounded-xl shadow-lg shadow-primary/20 hover:bg-primary-dim transition-colors text-sm">
                            Send Reset Code
                        </button>
                    </form>

                    <p class="text-center text-sm text-on-surface-variant mt-5">
                        Remembered it? <a href="login.html" class="text-primary font-semibold hover:underline">Sign in</a>
                    </p>
                </div>

                <!-- Step 2: Enter code + new password -->
                <div id="step-reset" class="hidden">
                    <div class="w-12 h-12 rounded-2xl bg-success/10 flex items-center justify-center mb-6">
                        <span class="material-symbols-outlined text-success text-2xl">mark_email_read</span>
                    </div>
                    <h1 class="text-2xl font-extrabold text-on-surface mb-1">Check your email</h1>
                    <p class="text-sm text-on-surface-variant mb-1">We sent a 6-digit code to</p>
                    <p id="display-email" class="text-sm font-semibold text-primary mb-6"></p>

                    <div id="reset-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-4"></div>
                    <div id="reset-success" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl px-4 py-3 text-sm mb-4"></div>

                    <form id="form-reset" class="space-y-4">
                        <div>
                            <label for="reset-code" class="block text-sm font-medium text-on-surface mb-1.5">Reset code</label>
                            <input type="text" id="reset-code" maxlength="6" inputmode="numeric" required placeholder="000000"
                                class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/60 bg-white/80 text-on-surface placeholder-on-surface-variant/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary text-sm tracking-[0.3em] text-center font-mono text-lg">
                        </div>
                        <div>
                            <label for="new-password" class="block text-sm font-medium text-on-surface mb-1.5">New password</label>
                            <input type="password" id="new-password" required placeholder="Min. 8 characters" minlength="8"
                                class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/60 bg-white/80 text-on-surface placeholder-on-surface-variant/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary text-sm">
                        </div>
                        <div>
                            <label for="confirm-password" class="block text-sm font-medium text-on-surface mb-1.5">Confirm new password</label>
                            <input type="password" id="confirm-password" required placeholder="Repeat password" minlength="8"
                                class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/60 bg-white/80 text-on-surface placeholder-on-surface-variant/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary text-sm">
                        </div>
                        <button type="submit" id="reset-btn"
                            class="w-full py-2.5 px-4 bg-primary text-on-primary font-bold rounded-xl shadow-lg shadow-primary/20 hover:bg-primary-dim transition-colors text-sm">
                            Reset Password
                        </button>
                    </form>

                    <p class="text-center text-sm text-on-surface-variant mt-4">
                        Didn't receive a code?
                        <button id="resend-btn" class="text-primary font-semibold hover:underline bg-transparent border-none cursor-pointer p-0">Resend</button>
                    </p>
                </div>

            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const API_URL = CONFIG.API_URL;
        let resetEmail = '';

        // Pre-fill email from query param (e.g. from reset email link)
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
            document.getElementById('req-email').value = emailParam;
        }

        // ── Step 1: request code ──────────────────────────────────────────
        document.getElementById('form-request').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('req-email').value.trim();
            const errDiv = document.getElementById('req-error');
            const btn = document.getElementById('req-btn');

            errDiv.classList.add('hidden'); errDiv.textContent = '';
            btn.textContent = 'Sending…'; btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                const data = await res.json();

                if (!res.ok) {
                    const msg = (data.error || data.detail) || 'Something went wrong. Please try again.';
                    errDiv.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg);
                    errDiv.classList.remove('hidden');
                    return;
                }

                resetEmail = email;
                document.getElementById('display-email').textContent = email;

                // Dev mode: pre-fill code
                if (data._dev_reset_code) {
                    document.getElementById('reset-code').value = data._dev_reset_code;
                }

                document.getElementById('step-request').classList.add('hidden');
                document.getElementById('step-reset').classList.remove('hidden');

            } catch (err) {
                errDiv.textContent = 'Network error. Please try again.';
                errDiv.classList.remove('hidden');
            } finally {
                btn.textContent = 'Send Reset Code'; btn.disabled = false;
            }
        });

        // ── Step 2: reset password ────────────────────────────────────────
        document.getElementById('form-reset').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('reset-code').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errDiv = document.getElementById('reset-error');
            const successDiv = document.getElementById('reset-success');
            const btn = document.getElementById('reset-btn');

            errDiv.classList.add('hidden'); errDiv.textContent = '';
            successDiv.classList.add('hidden'); successDiv.textContent = '';

            if (newPassword !== confirmPassword) {
                errDiv.textContent = 'Passwords do not match.';
                errDiv.classList.remove('hidden');
                return;
            }

            btn.textContent = 'Resetting…'; btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail, code, new_password: newPassword }),
                });
                const data = await res.json();

                if (!res.ok) {
                    const msg = (data.error || data.detail) || 'Reset failed. Please try again.';
                    errDiv.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg);
                    errDiv.classList.remove('hidden');
                    return;
                }

                successDiv.textContent = 'Password updated! Redirecting to login…';
                successDiv.classList.remove('hidden');
                btn.disabled = true;
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);

            } catch (err) {
                errDiv.textContent = 'Network error. Please try again.';
                errDiv.classList.remove('hidden');
            } finally {
                if (btn.disabled === false) { btn.textContent = 'Reset Password'; }
            }
        });

        // ── Resend code ───────────────────────────────────────────────────
        document.getElementById('resend-btn').addEventListener('click', async () => {
            const btn = document.getElementById('resend-btn');
            btn.textContent = 'Sending…'; btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail }),
                });
                const data = await res.json();
                const successDiv = document.getElementById('reset-success');
                successDiv.textContent = 'A new code has been sent to your email.';
                successDiv.classList.remove('hidden');
                if (data._dev_reset_code) {
                    document.getElementById('reset-code').value = data._dev_reset_code;
                }
            } catch (_) {}

            setTimeout(() => { btn.textContent = 'Resend'; btn.disabled = false; }, 3000);
        });
    </script>
</body>
</html>
